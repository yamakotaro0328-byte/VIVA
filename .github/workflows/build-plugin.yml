name: プラグインをビルド

on:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/build-plugin.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Javaをセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: ビルド（mvn package）
        working-directory: plugin
        run: mvn -B package

      - name: できあがったjarを保存
        uses: actions/upload-artifact@v4
        with:
          name: VivaStatsAPI
          path: plugin/target/VivaStatsAPI.jar
          if-no-files-found: error
