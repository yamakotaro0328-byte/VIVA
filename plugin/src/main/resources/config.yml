# ==========================================================
# VivaStatsAPI 設定ファイル
# ==========================================================

# HTTPサーバーがリクエストを受け付けるポート番号。
# サイト側（api/get-stats.js）は viva-mc.net:25566 を見に行くので、
# ポートを変える場合はサイト側の設定も合わせて変える必要があります。
port: 25566

# 待ち受けるアドレス。通常は変更不要です。
bind-address: "0.0.0.0"

# 空欄なら誰でもアクセスできます。
# 値を入れると、リクエストのヘッダーに
#   Authorization: Bearer <ここに書いた値>
# が無いと 401 を返すようになります（サイト側のVercel環境変数にも
# 同じ値を設定してください）。
token: ""

# 「接続履歴」に保存しておく件数（これを超えた古いものから消えます）
history-limit: 50

# 何秒おきにディスクへ保存するか
save-interval-seconds: 300
