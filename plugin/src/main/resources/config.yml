# ==========================================================
# VivaStatsAPI 設定ファイル
# ==========================================================

# HTTPサーバーがリクエストを受け付けるポート番号。
# サイト側（api/get-stats.js）は viva-mc.net:45678 を見に行くので、
# ポートを変える場合はサイト側の設定も合わせて変える必要があります。
port: 45678

# 待ち受けるアドレス。通常は変更不要です。
bind-address: "0.0.0.0"

# 空欄なら誰でもアクセスできます。
# 値を入れると、リクエストのヘッダーに
#   Authorization: Bearer <ここに書いた値>
# が無いと 401 を返すようになります（サイト側のVercel環境変数にも
# 同じ値を設定してください）。
token: ""

# 「接続履歴」に保存しておく件数（これを超えた古いものから消えます）
history-limit: 50

# 何秒おきにディスクへ保存するか
save-interval-seconds: 300

# 設置・破壊したブロック数を記録するか。
# WorldEditなどで大量に一気に置いたり壊したりするサーバーで、
# カウント自体を止めたい場合は false にしてください。
track-blocks: true

# 何分おきに「いま何人いるか」を記録するか（サイトの人数グラフ用。直近7日分を保存）
online-sample-minutes: 5

# Lands の土地・国の一覧（サイトの国家図鑑）を、何秒おきに作り直すか
lands-refresh-seconds: 60

# 年表（宣戦布告・終戦・同盟・建国など）を何件まで残すか
chronicle-limit: 300
